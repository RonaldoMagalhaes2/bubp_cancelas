<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Acesso</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #1f1f1f, #3a3a3a);
      color: white;
      text-align: center;
    }

    .login, .sistema {
      margin-top: 80px;
    }

    input {
      padding: 10px;
      margin: 10px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .entrar {
      background: #2196F3;
      color: white;
    }

    .erro {
      color: #ff5252;
      margin-top: 10px;
    }

    /* SISTEMA */
    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
      max-width: 700px;
      margin: 40px auto;
    }

    .card {
      background: #2b2b2b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .abrir {
      background: #00c853;
      color: white;
    }

    .abrir:hover {
      background: #00e676;
      transform: translateY(-4px) scale(1.08);
      box-shadow: 0 10px 25px rgba(0,255,100,0.5);
    }

    .fechar {
      background: #d50000;
      color: white;
    }

    .fechar:hover {
      background: #ff1744;
      transform: translateY(-4px) scale(1.08);
      box-shadow: 0 10px 25px rgba(255,0,0,0.5);
    }

    button:active {
      transform: scale(0.92);
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <h1>🔐 Acesso ao Sistema</h1>

  <input type="text" id="usuario" placeholder="Usuário"><br>
  <input type="password" id="senha" placeholder="Senha"><br>

  <button class="entrar" onclick="login()">Entrar</button>

  <div class="erro" id="erro"></div>
</div>

<!-- SISTEMA -->
<div class="sistema" id="sistema" style="display:none;">
  <h1>🚧 Controle de Cancelas - Pool de Uberlândia</h1>

  <div class="container">

    <div class="card">
      <h3>Cancela de Entrada - Lado Direito</h3>
      <button class="abrir" onclick="acionar(1,'on')">Abrir</button>
      <button class="fechar" onclick="acionar(1,'off')">Fechar</button>
    </div>

    <div class="card">
      <h3>Cancela de Entrada - Lado Esquerdo</h3>
      <button class="abrir" onclick="acionar(2,'on')">Abrir</button>
      <button class="fechar" onclick="acionar(2,'off')">Fechar</button>
    </div>

    <div class="card">
      <h3>Cancela de Saída para Carregamento</h3>
      <button class="abrir" onclick="acionar(3,'on')">Abrir</button>
      <button class="fechar" onclick="acionar(3,'off')">Fechar</button>
    </div>

    <div class="card">
      <h3>Cancela de Saída para Descarga</h3>
      <button class="abrir" onclick="acionar(4,'on')">Abrir</button>
      <button class="fechar" onclick="acionar(4,'off')">Fechar</button>
    </div>

  </div>
</div>

<script>
  const ipESP32 = "http://192.168.0.100"; // ALTERAR

  function login() {
    const user = document.getElementById("usuario").value;
    const pass = document.getElementById("senha").value;

    if (user === "pool" && pass === "0451") {
      document.getElementById("login").style.display = "none";
      document.getElementById("sistema").style.display = "block";
    } else {
      document.getElementById("erro").innerText = "Usuário ou senha incorretos";
    }
  }

  function acionar(cancela, estado) {
    fetch(`${ipESP32}/cancela${cancela}/${estado}`)
      .catch(() => alert("Erro ao conectar com ESP32"));
  }
</script>

</body>
</html>
